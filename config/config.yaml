node:
  host: ${NODE_HOST}
  http:
    enable: ${HTTP_ENABLE}
    port: ${HTTP_PORT}
  https:
    enable: ${HTTPS_ENABLE}
    port: ${HTTPS_PORT}
    cert: ${SSL_CERT_PATH}
    key: ${SSL_KEY_PATH}
  external: ${NODE_EXTERNAL_IP}
  delayLoading: ${NODE_DELAY_LOADING}

database:
  path: ${DB_PATH}

logging:
  level: ${LOGGING_LEVEL}

contracts:
  phoneLinkCollectionAddress : ${PHONE_LINK_COLLECTION_ADDRESS}

validator:
  validatorKey: ${LINK_VALIDATOR1}
  authenticationMode: ${AUTHENTICATION_MODE}

sms:
  endpoint: ${SMS_ENDPOINT}
  accessKey: ${SMS_ACCESSKEY}
